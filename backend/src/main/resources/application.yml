server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: utility-billing-api
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/utility_billing?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:utility}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:12MB}
security:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  seed-enabled: ${SEED_ENABLED:true}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  mail-from: ${MAIL_FROM:noreply@utility.local}
  jobs:
    overdue-cron: ${OVERDUE_CRON:0 10 0 * * *}
    reminder-cron: ${REMINDER_CRON:0 15 0 * * *}
    reminder-days: ${REMINDER_DAYS:3}
    token-purge-cron: ${TOKEN_PURGE_CRON:0 30 2 * * *}
    email-retry-cron: ${EMAIL_RETRY_CRON:0 */10 * * * *}
springdoc:
  swagger-ui.path: /swagger-ui.html
---
spring:
  config.activate.on-profile: prod
app.seed-enabled: false

