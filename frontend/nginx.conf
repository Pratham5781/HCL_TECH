server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location / {
  try_files $uri $uri/ /index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 }
 location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp)$ {
  expires 7d;
  add_header Cache-Control "public, max-age=604800, immutable";
  try_files $uri =404;
 }
}

